name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust with quality components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests with temporary SQLite databases
        run: cargo test --workspace

  web-quality:
    name: Web typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install stable Rust with the WASM target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install web dependencies
        run: npm ci

      - name: Build Rust WASM bindings
        run: npm run wasm:build

      - name: Typecheck web
        run: npm run typecheck

      - name: Test web
        run: npm run test

      - name: Build web
        run: npm run build

      - name: Audit web dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check whitespace
        run: git diff --check

  single-binary-smoke:
    name: Single-binary smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install stable Rust with the WASM target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install the pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build the embedded single binary
        run: ./scripts/build-single-binary.sh

      - name: Run from a source-free temporary directory
        run: ./scripts/smoke-single-binary.sh target/release/confdock

      - name: Package and re-test the downloadable archive
        run: |
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          ./scripts/package-single-binary.sh target/release/confdock "$package_dir"

  # Artifact publication is deliberately opt-in. Pull requests and pushes
  # execute the same packaging and extraction checks above without retaining
  # a downloadable artifact.
  single-binary-artifact:
    name: Build downloadable Linux x86_64 artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out a clean repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the fixed Rust toolchain and WASM target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          target: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build Rust WASM and Vite production assets
        run: |
          npm run wasm:build
          npm run build
        working-directory: web

      - name: Build the embedded Linux x86_64 binary
        run: ./scripts/build-single-binary.sh

      - name: Inspect Linux compatibility and build sizes
        run: |
          file target/release/confdock
          ldd target/release/confdock
          printf 'binary_bytes=%s\n' "$(wc -c < target/release/confdock | tr -d ' ')"
          printf 'web_dist_bytes=%s\n' "$(find web/dist -type f -print0 | xargs -0 wc -c | tail -1 | awk '{print $1}')"
          printf 'wasm_bytes=%s\n' "$(find web/dist -type f -name '*.wasm' -print0 | xargs -0 wc -c | tail -1 | awk '{print $1}')"

      - name: Package, extract, verify SHA-256, and smoke-test
        run: ./scripts/package-single-binary.sh target/release/confdock artifact

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: confdock-linux-x86_64
          path: |
            artifact/confdock-linux-x86_64.tar.gz
            artifact/confdock-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
