name: Documentation CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run docs:build --prefix docs

      - name: Audit documentation dependencies
        # VitePress 1.6.4 is required for this site and currently pulls an
        # esbuild advisory with no upstream fix. Keep the report visible while
        # allowing documentation builds to remain actionable.
        continue-on-error: true
        run: npm audit --prefix docs
