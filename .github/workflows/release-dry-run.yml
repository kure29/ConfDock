name: Release dry-run

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'web/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSE_INVENTORY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'deploy/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'web/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSE_INVENTORY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'deploy/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'README.md'
      - 'README.en.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Linux amd64 release build without publication
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Set up exact Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.88.0
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install exact wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install exact Syft
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          syft-version: v1.50.0

      - name: Run complete source, artifact, image, volume, and SBOM dry-run
        env:
          CONFDOCK_IMAGE: confdock:release-dry-run
        run: ./scripts/run-release-dry-run.sh "$RUNNER_TEMP/confdock-release-dry-run" "$CONFDOCK_IMAGE"

      - name: Summarize ephemeral outputs
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/confdock-release-dry-run" ]; then
            find "$RUNNER_TEMP/confdock-release-dry-run" -type f \
              -printf '%P %s bytes\n' | LC_ALL=C sort
          fi
          printf '%s\n' 'Dry-run artifacts are intentionally not uploaded or published.'
