name: Deploy documentation to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ref-check:
    name: Check deployment branch
    runs-on: ubuntu-latest
    steps:
      - name: Allow deployment only from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Pages deployment is limited to main; skipping ${GITHUB_REF}."
            exit 0
          fi
          echo "Deploying the main branch."

  build:
    name: Build Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: ref-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run docs:build --prefix docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
