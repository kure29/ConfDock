[package]
name = "confdock-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Axum and SQLite service boundary for ConfDock"

[lib]
path = "src/lib.rs"

[[bin]]
name = "confdock"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
confdock-core = { path = "../confdock-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
