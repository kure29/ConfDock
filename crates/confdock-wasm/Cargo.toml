[package]
name = "confdock-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen boundary for the ConfDock configuration core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
confdock-core = { path = "../confdock-core" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[lints]
workspace = true
